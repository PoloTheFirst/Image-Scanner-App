<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#001f3f">
<title>BookCover Matcher — pHash + Excel (comment fills)</title>
<style>
  :root{
    --navy-950:#000d1a; --navy-900:#001428; --navy-800:#001f3f;
    --navy-700:#062b52; --navy-650:#083663; --line:#154a7e;
    --text:#eaf3fb; --muted:#8fb2d4;
    --accent:#00d4ff; --accent-2:#22e0c8;
    --danger:#ff6b6b; --ok:#3ddc84; --warn:#ffb020;
    --radius:16px;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0; min-height:100dvh;
    background:
      radial-gradient(120% 60% at 50% 0%, #07407a 0%, #00254a 40%, var(--navy-800) 65%, var(--navy-950) 100%) fixed;
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:16px; line-height:1.45;
    padding-bottom:env(safe-area-inset-bottom);
    -webkit-font-smoothing:antialiased;
  }
  .app{ max-width:560px; margin:0 auto; padding:16px 14px 48px; }
  header{ text-align:center; margin-bottom:14px; }
  header h1{ margin:0; font-size:1.35rem; letter-spacing:.02em; font-weight:800; }
  header h1 span{ color:var(--accent); }
  .tagline{ margin:4px 0 0; font-size:.76rem; color:var(--muted); letter-spacing:.02em; }

  .camera{
    position:relative; width:100%; aspect-ratio:3/4; max-height:56vh;
    background:#000; border:1px solid var(--line); border-radius:18px;
    overflow:hidden; box-shadow:0 14px 34px rgba(0,0,0,.5);
  }
  .camera video{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; display:block; background:#000;
  }
  .cam-overlay{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
  .guide{
    position:relative; width:70%; height:78%;
    border:2px dashed rgba(0,212,255,.40); border-radius:14px;
    box-shadow:0 0 0 2000px rgba(0,16,32,.30);
  }
  .corner{ position:absolute; width:28px; height:28px; border:4px solid var(--accent); border-radius:3px; }
  .corner.tl{ top:-5px; left:-5px;  border-right:none; border-bottom:none; border-top-left-radius:14px; }
  .corner.tr{ top:-5px; right:-5px; border-left:none;  border-bottom:none; border-top-right-radius:14px; }
  .corner.bl{ bottom:-5px; left:-5px; border-right:none; border-top:none; border-bottom-left-radius:14px; }
  .corner.br{ bottom:-5px; right:-5px; border-left:none; border-top:none; border-bottom-right-radius:14px; }
  .cam-badge{
    position:absolute; top:10px; left:10px; padding:6px 12px;
    border-radius:999px; font-size:.68rem; font-weight:800;
    letter-spacing:.08em; text-transform:uppercase; color:var(--accent);
    background:rgba(0,20,40,.72); border:1px solid rgba(0,212,255,.35);
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  }

  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; min-height:54px; padding:14px 18px;
    font-family:inherit; font-size:1rem; font-weight:800;
    letter-spacing:.01em; color:var(--text);
    background:linear-gradient(180deg,var(--navy-650),var(--navy-700));
    border:0; border-radius:14px; cursor:pointer;
    box-shadow:0 2px 0 rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
    transition:transform .08s ease, filter .15s ease, opacity .15s ease;
    -webkit-tap-highlight-color:transparent; touch-action:manipulation;
    user-select:none;
  }
  .btn:active{ transform:translateY(1px) scale(.99); }
  .btn[disabled]{ opacity:.5; pointer-events:none; }
  .btn.primary{
    background:linear-gradient(180deg,#00e0ff,#0090c8); color:#00223b;
    box-shadow:0 6px 20px rgba(0,212,255,.28);
  }
  .btn.accent{
    background:linear-gradient(180deg,#25e6c5,#00a68f); color:#00261f;
    box-shadow:0 6px 20px rgba(34,224,200,.25); margin-top:4px;
  }
  .btn.ghost{
    background:transparent; border:1px solid var(--line);
    box-shadow:none; color:var(--muted); font-weight:700;
  }
  .row{ display:flex; gap:10px; margin-top:12px; }
  .row .btn.ghost{ flex:0 0 58px; padding:0; font-size:1.25rem; }

  .panel{
    margin-top:14px; padding:14px;
    border:1px solid var(--line); border-radius:var(--radius);
    background:linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.018));
  }
  .panel h2{
    margin:0 0 12px; font-size:.74rem; font-weight:800;
    letter-spacing:.12em; text-transform:uppercase; color:var(--accent);
  }
  .field{ display:block; margin-bottom:12px; }
  .field > span{
    display:block; margin-bottom:6px; font-size:.7rem; font-weight:800;
    letter-spacing:.09em; text-transform:uppercase; color:var(--muted);
  }
  input[type="text"]{
    width:100%; min-height:54px; padding:12px 14px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:1rem; letter-spacing:.06em; color:var(--text);
    background:rgba(0,0,0,.30); border:1px solid var(--line);
    border-radius:12px; outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  input[type="text"]:focus{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(0,212,255,.15); }
  input[type="file"]{
    width:100%; min-height:54px; padding:10px 12px;
    font-family:inherit; font-size:.85rem; color:var(--muted);
    background:rgba(0,0,0,.22); border:1px dashed var(--line);
    border-radius:12px; cursor:pointer;
  }
  input[type="file"]::file-selector-button{
    margin-right:12px; padding:10px 14px;
    font-family:inherit; font-size:.82rem; font-weight:800;
    color:var(--text); background:var(--navy-650);
    border:0; border-radius:10px; cursor:pointer;
  }

  .target{
    display:flex; gap:12px; align-items:center; padding:10px;
    margin-bottom:12px; border:1px solid var(--line);
    border-radius:12px; background:rgba(0,0,0,.22);
  }
  .target img{
    flex:0 0 auto; width:56px; height:76px; object-fit:cover;
    border-radius:8px; border:1px solid var(--line); background:#000;
  }
  .target-info{ flex:1 1 auto; min-width:0; }
  .target-label{
    margin-bottom:4px; font-size:.66rem; font-weight:800;
    letter-spacing:.1em; text-transform:uppercase; color:var(--muted);
  }
  #targetHash{
    display:block; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:.6rem; line-height:1.35; color:var(--accent); word-break:break-all;
  }

  #results{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
  #results li.empty{
    padding:22px 10px; text-align:center; font-size:.82rem;
    color:var(--muted); border:1px dashed var(--line); border-radius:12px;
  }
  .result{
    display:flex; align-items:center; gap:12px; padding:10px;
    border:1px solid var(--line); border-radius:14px;
    background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
    animation:pop .22s ease both;
  }
  @keyframes pop{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none;} }
  .rank{
    flex:0 0 auto; width:28px; height:28px; display:grid; place-items:center;
    border-radius:50%; font-size:.76rem; font-weight:800;
    color:var(--accent); background:rgba(0,212,255,.14);
    border:1px solid rgba(0,212,255,.35);
  }
  .thumb{
    flex:0 0 auto; width:46px; height:62px; object-fit:cover;
    border-radius:8px; border:1px solid var(--line); background:#000;
  }
  .meta{ flex:1 1 auto; min-width:0; }
  .meta .cell{ font-size:.84rem; color:var(--text); }
  .meta .cell strong{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:.98rem; color:var(--accent);
  }
  .meta .sub{
    margin-top:2px; font-size:.66rem; color:var(--muted);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .bar{ height:6px; margin-top:7px; border-radius:99px; background:rgba(255,255,255,.09); overflow:hidden; }
  .bar i{ display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,#0a84c8,#00d4ff); }
  .bar i.high{ background:linear-gradient(90deg,#0aa85f,#3ddc84); }
  .bar i.mid{ background:linear-gradient(90deg,#0a84c8,#00d4ff); }
  .bar i.low{ background:linear-gradient(90deg,#a06a00,#ffb020); }
  .pct{
    flex:0 0 auto; font-size:.95rem; font-weight:800;
    font-variant-numeric:tabular-nums; color:var(--accent);
  }
  .pct.high{ color:var(--ok); }
  .pct.mid{ color:var(--accent); }
  .pct.low{ color:var(--warn); }

  #toast{
    position:fixed; left:50%;
    bottom:calc(18px + env(safe-area-inset-bottom));
    transform:translate(-50%,140%);
    max-width:92vw; padding:12px 18px;
    font-size:.86rem; font-weight:600; color:var(--text);
    background:rgba(0,30,55,.97); border:1px solid var(--line);
    border-radius:12px; box-shadow:0 12px 34px rgba(0,0,0,.55);
    opacity:0; transition:transform .3s ease, opacity .3s ease;
    z-index:60; pointer-events:none;
  }
  #toast.show{ transform:translate(-50%,0); opacity:1; }
  #toast.err{ border-color:rgba(255,107,107,.6); color:#ffd9d9; }
  #toast.ok{ border-color:rgba(61,220,132,.55); }

  @media (min-width:520px){ .camera{ max-height:60vh; } header h1{ font-size:1.6rem; } }
</style>
</head>
<body>

<div class="app">

  <header>
    <h1>Book<span>Cover</span> Matcher</h1>
    <p class="tagline">Scan a cover · pHash it · find it inside your spreadsheet</p>
  </header>

  <section class="camera">
    <video id="video" autoplay playsinline muted></video>
    <div class="cam-overlay">
      <div class="guide">
        <i class="corner tl"></i><i class="corner tr"></i>
        <i class="corner bl"></i><i class="corner br"></i>
      </div>
    </div>
    <div class="cam-badge" id="camBadge">Starting…</div>
  </section>

  <div class="row">
    <button id="btnScan" class="btn primary">📸 Scan Book Cover</button>
    <button id="btnRestart" class="btn ghost" title="Restart camera" aria-label="Restart camera">↻</button>
  </div>

  <section class="panel">
    <h2>1 · Spreadsheet &amp; range</h2>

    <label class="field">
      <span>Excel file (.xlsx)</span>
      <input type="file" id="fileXlsx"
             accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
    </label>

    <label class="field">
      <span>Cell range to search</span>
      <input type="text" id="rangeInput" value="A1:B20"
             inputmode="text" autocapitalize="characters" autocomplete="off" spellcheck="false">
    </label>

    <label class="field">
      <span>…or use an image from your device</span>
      <input type="file" id="fileImage" accept="image/*">
    </label>

    <div class="target" id="targetPreview" hidden>
      <img id="targetThumb" alt="Target preview">
      <div class="target-info">
        <div class="target-label">Target pHash (64-bit)</div>
        <code id="targetHash">—</code>
      </div>
    </div>

    <button id="btnMatch" class="btn accent">🔗 Link &amp; Find Top 5</button>
  </section>

  <section class="panel">
    <h2>2 · Top 5 matches</h2>
    <ul id="results">
      <li class="empty">No results yet — scan a cover, then press “Link &amp; Find Top 5”.</li>
    </ul>
  </section>

</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
'use strict';

/* ============================================================================
   CDN SOURCES
   JSZip is required: cell-comment images live inside the .xlsx's VML
   drawing part, which ExcelJS does NOT expose through its public API.
   ============================================================================ */
const OPENCV_URL  = 'https://docs.opencv.org/4.10.0/opencv.js';
const EXCELJS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
const JSZIP_URL   = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';

/* ============================================================================
   DOM
   ============================================================================ */
const $ = (id) => document.getElementById(id);
const video         = $('video');
const camBadge      = $('camBadge');
const btnScan       = $('btnScan');
const btnRestart    = $('btnRestart');
const fileXlsx      = $('fileXlsx');
const rangeInput    = $('rangeInput');
const fileImage     = $('fileImage');
const btnMatch      = $('btnMatch');
const resultsEl     = $('results');
const toastEl       = $('toast');
const targetPreview = $('targetPreview');
const targetThumb   = $('targetThumb');
const targetHash    = $('targetHash');

const BTN_MATCH_LABEL = '🔗 Link & Find Top 5';

/* ============================================================================
   STATE
   ============================================================================ */
let stream       = null;
let scanHash     = null;
let scanThumbUrl = null;
let excelImages  = [];
let cvIsReady    = false;
let busy         = false;

/* ============================================================================
   UTILITIES
   ============================================================================ */
let toastTimer = null;
function toast(msg, kind) {
  toastEl.textContent = msg;
  toastEl.className = 'show' + (kind ? ' ' + kind : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.className = ''; }, 4500);
}
const setBadge = (t) => { camBadge.textContent = t; };

function setBusy(state, label) {
  busy = state;
  btnMatch.disabled = state;
  btnScan.disabled  = state;
  btnMatch.textContent = state ? (label || 'Working…') : BTN_MATCH_LABEL;
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.async = true;
    s.onload  = () => resolve();
    s.onerror = () => reject(new Error('Could not load ' + src));
    document.head.appendChild(s);
  });
}

function readFileAsArrayBuffer(file) {
  if (typeof file.arrayBuffer === 'function') return file.arrayBuffer();
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload  = () => resolve(fr.result);
    fr.onerror = () => reject(fr.error || new Error('File read error'));
    fr.readAsArrayBuffer(file);
  });
}

/* ============================================================================
   LIBRARY BOOTSTRAPPING
   ============================================================================ */
let excelJsPromise = null;
function ensureExcelJS() {
  if (window.ExcelJS) return Promise.resolve();
  if (!excelJsPromise) excelJsPromise = loadScript(EXCELJS_URL);
  return excelJsPromise.then(() => {
    if (!window.ExcelJS) throw new Error('ExcelJS failed to initialise.');
  });
}

let jsZipPromise = null;
function ensureJSZip() {
  if (window.JSZip) return Promise.resolve();
  if (!jsZipPromise) jsZipPromise = loadScript(JSZIP_URL);
  return jsZipPromise.then(() => {
    if (!window.JSZip) throw new Error('JSZip failed to initialise.');
  });
}

function waitForOpenCV() {
  if (window.cv && cv.Mat) return Promise.resolve();
  return new Promise((resolve, reject) => {
    let settled = false;
    const finish = () => { if (!settled) { settled = true; resolve(); } };
    try { cv['onRuntimeInitialized'] = finish; } catch (e) {}
    const started = Date.now();
    const iv = setInterval(() => {
      if (window.cv && cv.Mat) { clearInterval(iv); finish(); }
      else if (Date.now() - started > 30000) {
        clearInterval(iv); reject(new Error('OpenCV runtime timed out'));
      }
    }, 100);
  });
}

let openCvPromise = null;
function ensureOpenCV() {
  if (cvIsReady) return Promise.resolve(true);
  if (!openCvPromise) {
    openCvPromise = loadScript(OPENCV_URL)
      .then(waitForOpenCV)
      .then(() => { cvIsReady = true; return true; })
      .catch((err) => {
        console.warn('[OpenCV] unavailable, using pure-JS DCT fallback:', err);
        return false;
      });
  }
  return openCvPromise;
}

/* ============================================================================
   CAMERA
   ============================================================================ */
async function startCamera() {
  setBadge('Starting…');
  stopCamera();

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setBadge('No camera API');
    toast('Camera API unavailable — use the image upload instead.', 'err');
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1280 },
        height: { ideal: 1280 }
      }
    });
    video.srcObject = stream;
    video.setAttribute('playsinline', '');
    await video.play().catch(() => {});
    setBadge('Live');
  } catch (err) {
    setBadge('Camera off');
    const msg = (err && err.name === 'NotAllowedError')
      ? 'Camera permission denied. Upload an image instead.'
      : 'Camera error: ' + (err && err.message ? err.message : err);
    toast(msg, 'err');
  }
}
function stopCamera() {
  if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
}
function grabVideoFrame() {
  const w = video.videoWidth, h = video.videoHeight;
  if (!w || !h) throw new Error('Camera stream is not ready yet.');
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').drawImage(video, 0, 0, w, h);
  return c;
}

/* ============================================================================
   pHash — 8x8 DCT perceptual hash (64 bits)
   ============================================================================ */
function hashFromCoeffs(coeffs) {
  // Exclude DC term (index 0) from median — it dominates the AC band.
  const ac = coeffs.slice(1).sort((a, b) => a - b);
  const mid = Math.floor(ac.length / 2);
  const median = (ac.length % 2) ? ac[mid] : (ac[mid - 1] + ac[mid]) / 2;
  let bits = '';
  for (let i = 0; i < coeffs.length; i++) bits += (coeffs[i] > median) ? '1' : '0';
  return bits;
}

function phashWithOpenCV(canvas) {
  let src = null, gray = null, small = null, f32 = null, dctMat = null;
  try {
    src = cv.imread(canvas);
    gray = new cv.Mat();
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    small = new cv.Mat();
    cv.resize(gray, small, new cv.Size(32, 32), 0, 0, cv.INTER_AREA);
    f32 = new cv.Mat();
    small.convertTo(f32, cv.CV_32F);
    dctMat = new cv.Mat();
    cv.dct(f32, dctMat);
    const d = dctMat.data32F;
    const coeffs = new Array(64);
    for (let r = 0; r < 8; r++)
      for (let c = 0; c < 8; c++)
        coeffs[r * 8 + c] = d[r * 32 + c];
    return hashFromCoeffs(coeffs);
  } finally {
    if (src) src.delete();
    if (gray) gray.delete();
    if (small) small.delete();
    if (f32) f32.delete();
    if (dctMat) dctMat.delete();
  }
}

const DCT_COS = (() => {
  const t = new Float64Array(32 * 32);
  for (let u = 0; u < 32; u++)
    for (let x = 0; x < 32; x++)
      t[u * 32 + x] = Math.cos(((2 * x + 1) * u * Math.PI) / 64);
  return t;
})();

function phashPureJS(canvas) {
  const small = document.createElement('canvas');
  small.width = 32; small.height = 32;
  const ctx = small.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(canvas, 0, 0, 32, 32);
  const px = ctx.getImageData(0, 0, 32, 32).data;

  const gray = new Float64Array(1024);
  for (let i = 0; i < 1024; i++) {
    const o = i * 4;
    gray[i] = 0.299 * px[o] + 0.587 * px[o + 1] + 0.114 * px[o + 2];
  }
  const tmp = new Float64Array(1024);
  for (let y = 0; y < 32; y++) {
    const rowOff = y * 32;
    for (let u = 0; u < 32; u++) {
      const cosOff = u * 32;
      let s = 0;
      for (let x = 0; x < 32; x++) s += gray[rowOff + x] * DCT_COS[cosOff + x];
      tmp[rowOff + u] = s;
    }
  }
  const dct = new Float64Array(1024);
  for (let x = 0; x < 32; x++) {
    for (let v = 0; v < 32; v++) {
      const cosOff = v * 32;
      let s = 0;
      for (let y = 0; y < 32; y++) s += tmp[y * 32 + x] * DCT_COS[cosOff + y];
      dct[v * 32 + x] = s;
    }
  }
  const coeffs = new Array(64);
  for (let r = 0; r < 8; r++)
    for (let c = 0; c < 8; c++)
      coeffs[r * 8 + c] = dct[r * 32 + c];
  return hashFromCoeffs(coeffs);
}

function computePHashFromCanvas(canvas) {
  if (cvIsReady && window.cv && cv.Mat && typeof cv.dct === 'function') {
    try { return phashWithOpenCV(canvas); }
    catch (e) { console.warn('[pHash] OpenCV path failed, using fallback:', e); }
  }
  return phashPureJS(canvas);
}

function hammingDistance(a, b) {
  if (!a || !b || a.length !== b.length) return 64;
  let d = 0;
  for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) d++;
  return d;
}

/* ============================================================================
   IMAGE HELPERS
   ============================================================================ */
function makeThumb(source, w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#001428';
  ctx.fillRect(0, 0, w, h);
  const sw = source.width || 1, sh = source.height || 1;
  const scale = Math.min(w / sw, h / sh);
  const dw = sw * scale, dh = sh * scale;
  ctx.drawImage(source, (w - dw) / 2, (h - dh) / 2, dw, dh);
  return c.toDataURL('image/jpeg', 0.72);
}

function fileToCanvas(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const MAX = 800;
        const iw = img.naturalWidth || img.width;
        const ih = img.naturalHeight || img.height;
        const scale = Math.min(1, MAX / Math.max(iw, ih));
        const c = document.createElement('canvas');
        c.width  = Math.max(1, Math.round(iw * scale));
        c.height = Math.max(1, Math.round(ih * scale));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c);
      } catch (e) { reject(e); }
      finally { URL.revokeObjectURL(url); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Unsupported or corrupt image file.')); };
    img.src = url;
  });
}

function bufferToCanvas(bytes, mime) {
  return new Promise((resolve, reject) => {
    const blob = new Blob([bytes], { type: mime });
    const url  = URL.createObjectURL(blob);
    const img  = new Image();
    img.onload = () => {
      try {
        const MAX = 640;
        const iw = img.naturalWidth || img.width;
        const ih = img.naturalHeight || img.height;
        const scale = Math.min(1, MAX / Math.max(iw, ih));
        const c = document.createElement('canvas');
        c.width  = Math.max(1, Math.round(iw * scale));
        c.height = Math.max(1, Math.round(ih * scale));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c);
      } catch (e) { reject(e); }
      finally { URL.revokeObjectURL(url); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not decode embedded image.')); };
    img.src = url;
  });
}

/* ============================================================================
   BINARY / MIME HELPERS
   ============================================================================ */
function toUint8Array(buf) {
  if (!buf) return null;
  if (buf instanceof Uint8Array) return buf;
  if (buf instanceof ArrayBuffer) return new Uint8Array(buf);
  if (Array.isArray(buf)) return new Uint8Array(buf);
  if (buf.buffer instanceof ArrayBuffer) {
    return new Uint8Array(buf.buffer, buf.byteOffset || 0, buf.byteLength);
  }
  if (buf.type === 'Buffer' && Array.isArray(buf.data)) return new Uint8Array(buf.data);
  if (Array.isArray(buf.data)) return new Uint8Array(buf.data);
  return null;
}

function sniffMime(bytes) {
  if (!bytes || bytes.length < 4) return null;
  const b = bytes;
  if (b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4E && b[3] === 0x47) return 'image/png';
  if (b[0] === 0xFF && b[1] === 0xD8) return 'image/jpeg';
  if (b[0] === 0x47 && b[1] === 0x49 && b[2] === 0x46) return 'image/gif';
  if (b[0] === 0x42 && b[1] === 0x4D) return 'image/bmp';
  if (b[0] === 0x52 && b[1] === 0x49 && b[2] === 0x46 && b[3] === 0x46) return 'image/webp';
  return null;
}
function mimeFromExtension(ext) {
  switch (String(ext || '').toLowerCase()) {
    case 'png':  return 'image/png';
    case 'jpg': case 'jpeg': case 'jfif': return 'image/jpeg';
    case 'gif':  return 'image/gif';
    case 'bmp':  return 'image/bmp';
    case 'webp': return 'image/webp';
    default:     return 'image/png';
  }
}

/** Resolve an OPC relationship Target (may contain ../) against a base dir. */
function resolvePath(baseDir, target) {
  if (!target) return '';
  if (target.charAt(0) === '/') return target.slice(1);
  const parts = (baseDir + target).split('/');
  const stack = [];
  for (const p of parts) {
    if (p === '' || p === '.') continue;
    if (p === '..') stack.pop();
    else stack.push(p);
  }
  return stack.join('/');
}

/* ============================================================================
   EXCELJS — range parsing (0-based indices)
   ============================================================================ */
function columnLettersToIndex(letters) {
  let n = 0;
  for (let i = 0; i < letters.length; i++)
    n = n * 26 + (letters.charCodeAt(i) - 64);
  return n - 1;
}
function indexToColumnLetters(index) {
  let s = '', n = index + 1;
  while (n > 0) {
    const r = (n - 1) % 26;
    s = String.fromCharCode(65 + r) + s;
    n = Math.floor((n - 1) / 26);
  }
  return s;
}
function parseRange(str) {
  const cleaned = String(str || '').trim().toUpperCase().replace(/\$/g, '');
  const m = cleaned.match(/^([A-Z]+)(\d+)\s*:\s*([A-Z]+)(\d+)$/);
  if (!m) throw new Error('Invalid range — use a format like A1:B20.');
  const cA = columnLettersToIndex(m[1]);
  const rA = parseInt(m[2], 10) - 1;
  const cB = columnLettersToIndex(m[3]);
  const rB = parseInt(m[4], 10) - 1;
  return {
    r1: Math.min(rA, rB), r2: Math.max(rA, rB),
    c1: Math.min(cA, cB), c2: Math.max(cA, cB)
  };
}

/* ============================================================================
   EXTRACTION #1 — floating / anchored images (worksheet.getImages)
   ============================================================================ */
function findMediaEntry(workbook, imageId) {
  const idNum = Number(imageId);
  const pools = [];
  if (workbook && workbook.model && Array.isArray(workbook.model.media)) pools.push(workbook.model.media);
  if (workbook && Array.isArray(workbook.media)) pools.push(workbook.media);
  for (const pool of pools) {
    for (const m of pool) {
      if (!m) continue;
      if (Number(m.index) === idNum || String(m.index) === String(imageId)) return m;
    }
    if (Number.isInteger(idNum) && pool[idNum]) return pool[idNum];
  }
  return null;
}

async function extractFloatingImages(workbook, sheet, range) {
  const out = [];
  let images = [];
  try { images = sheet.getImages() || []; } catch (e) { images = []; }

  for (const img of images) {
    if (!img || !img.range) continue;
    const tl = img.range.tl;
    if (!tl) continue;
    const rawRow = (tl.row !== undefined && tl.row !== null) ? tl.row : tl.nativeRow;
    const rawCol = (tl.col !== undefined && tl.col !== null) ? tl.col : tl.nativeCol;
    if (rawRow === undefined || rawCol === undefined) continue;

    const row = Math.floor(Number(rawRow));
    const col = Math.floor(Number(rawCol));
    if (row < range.r1 || row > range.r2 || col < range.c1 || col > range.c2) continue;

    const media = findMediaEntry(workbook, img.imageId);
    if (!media || !media.buffer) continue;
    const bytes = toUint8Array(media.buffer);
    if (!bytes || !bytes.length) continue;

    const mime = sniffMime(bytes) || mimeFromExtension(media.extension);
    let canvas;
    try { canvas = await bufferToCanvas(bytes, mime); }
    catch (e) { console.warn('[float] Skipping undecodable image', e); continue; }

    out.push({
      imageId: 'img#' + img.imageId,
      cell: indexToColumnLetters(col) + (row + 1),
      row: row, col: col,
      hash: computePHashFromCanvas(canvas),
      thumb: makeThumb(canvas, 88, 118),
      source: 'floating'
    });

    if (out.length >= 300) break;
  }
  return out;
}

/* ============================================================================
   EXTRACTION #2 — images used as a COMMENT fill (VML drawing part)

   Excel stores "Format Comment → Fill Effect → Picture" inside a VML
   drawing part (xl/drawings/vmlDrawingN.vml). The shape that represents the
   comment carries the picture via:
       <v:fill o:relid="rIdX" .../>        (most common — fill effect)
       <v:imagedata r:id="rIdX" .../>      (rare — inline picture in note)
   The relationship id is resolved through the sibling .rels file, whose
   Target points into xl/media/. The comment's anchor cell is given by the
   <x:Row> and <x:Column> elements inside <x:ClientData> (0-based).

   None of this is surfaced by ExcelJS's public API, so we unzip the file
   ourselves with JSZip and walk the VML directly.
   ============================================================================ */
async function extractCommentImages(arrayBuffer, range) {
  const JSZip = window.JSZip;
  if (!JSZip) return [];

  const zip = await JSZip.loadAsync(arrayBuffer);
  const out = [];
  const seenCells = new Set();

  // Every VML drawing part belongs to some sheet's comment layer.
  const vmlPaths = Object.keys(zip.files).filter((n) =>
    /^xl\/drawings\/vmlDrawing\d+\.vml$/i.test(n)
  );

  for (const vmlPath of vmlPaths) {
    const vmlFile = zip.file(vmlPath);
    if (!vmlFile) continue;
    const vmlText = await vmlFile.async('string');

    // --- Load the sibling .rels for this VML drawing ---
    const vmlName = vmlPath.split('/').pop();
    const relsPath = 'xl/drawings/_rels/' + vmlName + '.rels';
    const relsFile = zip.file(relsPath);
    if (!relsFile) continue;
    const relsText = await relsFile.async('string');

    // --- Parse Id → Target map (robust to attribute order) ---
    const relMap = {};
    const relElems = relsText.match(/<Relationship\b[^>]*\/?>/g) || [];
    for (const el of relElems) {
      const idM = el.match(/\bId="([^"]+)"/);
      const tM  = el.match(/\bTarget="([^"]+)"/);
      if (idM && tM) relMap[idM[1]] = tM[1];
    }

    // --- Walk each <v:shape ...>…</v:shape> block ---
    const shapeRe = /<v:shape\s[^>]*>([\s\S]*?)<\/v:shape>/gi;
    let sm;
    while ((sm = shapeRe.exec(vmlText)) !== null) {
      const full  = sm[0];    // includes the opening tag
      const inner = sm[1];    // inner markup only

      // Anchor cell (0-based, exactly the comment's cell)
      const rowM = inner.match(/<x:Row>\s*(\d+)\s*<\/x:Row>/i);
      const colM = inner.match(/<x:Column>\s*(\d+)\s*<\/x:Column>/i);
      if (!rowM || !colM) continue;
      const row = parseInt(rowM[1], 10);
      const col = parseInt(colM[1], 10);

      if (row < range.r1 || row > range.r2 || col < range.c1 || col > range.c2) continue;

      // --- Locate the image reference in the shape ---
      let relId = null, mref;
      // (a) fill effect picture:  <v:fill o:relid="rIdX" .../>
      mref = full.match(/<v:fill\b[^>]*\bo:relid="([^"]+)"/i);
      if (mref) relId = mref[1];
      // (b) inline picture in note: <v:imagedata r:id="rIdX" .../>
      if (!relId) {
        mref = full.match(/<v:imagedata\b[^>]*\br:id="([^"]+)"/i);
        if (mref) relId = mref[1];
      }
      // (c) alternative attribute spellings
      if (!relId) {
        mref = full.match(/<v:fill\b[^>]*\br:id="([^"]+)"/i);
        if (mref) relId = mref[1];
      }
      if (!relId) {
        mref = full.match(/<v:imagedata\b[^>]*\bo:relid="([^"]+)"/i);
        if (mref) relId = mref[1];
      }
      if (!relId) continue;

      const target = relMap[relId];
      if (!target) continue;

      // Targets inside the VML .rels are relative to xl/drawings/
      const mediaPath = resolvePath('xl/drawings/', target);
      const mediaFile = zip.file(mediaPath);
      if (!mediaFile) continue;

      const bytes = await mediaFile.async('uint8array');
      if (!bytes || !bytes.length) continue;

      const mime = sniffMime(bytes) || mimeFromExtension(mediaPath.split('.').pop());

      let canvas;
      try { canvas = await bufferToCanvas(bytes, mime); }
      catch (e) { console.warn('[comment] Undecodable image:', mediaPath, e); continue; }

      const cell = indexToColumnLetters(col) + (row + 1);
      if (seenCells.has(cell)) continue;
      seenCells.add(cell);

      out.push({
        imageId: mediaPath,
        cell: cell,
        row: row, col: col,
        hash: computePHashFromCanvas(canvas),
        thumb: makeThumb(canvas, 88, 118),
        source: 'comment-fill'
      });
    }
  }

  return out;
}

/* ============================================================================
   COMBINED EXTRACTION
   ============================================================================ */
async function extractAllImages(arrayBuffer, workbook, sheet, range) {
  const combined = [];

  // 1) Floating images via ExcelJS (fast, but misses comment fills)
  try {
    const floating = await extractFloatingImages(workbook, sheet, range);
    combined.push(...floating);
    console.log('[extract] floating images:', floating.length);
  } catch (e) {
    console.warn('[extract] Floating extraction failed:', e);
  }

  // 2) Comment-fill images via raw VML parse
  try {
    const comments = await extractCommentImages(arrayBuffer, range);
    combined.push(...comments);
    console.log('[extract] comment-fill images:', comments.length);
  } catch (e) {
    console.warn('[extract] Comment extraction failed:', e);
  }

  // 3) Deduplicate by cell coordinate
  const seen = new Set();
  return combined.filter((r) => {
    if (seen.has(r.cell)) return false;
    seen.add(r.cell);
    return true;
  });
}

/* ============================================================================
   TARGET PREVIEW
   ============================================================================ */
function updateScanPreview() {
  targetPreview.hidden = false;
  targetThumb.src = scanThumbUrl || '';
  targetHash.textContent = scanHash || '—';
}

/* ============================================================================
   RESULTS RENDERING
   ============================================================================ */
function renderResults(list) {
  if (!list || !list.length) {
    resultsEl.innerHTML = '<li class="empty">No matches to show.</li>';
    return;
  }
  resultsEl.innerHTML = '';
  list.forEach((item, i) => {
    const pct = item.percent.toFixed(1);
    const level = item.percent >= 80 ? 'high' : (item.percent >= 65 ? 'mid' : 'low');
    const li = document.createElement('li');
    li.className = 'result';
    li.innerHTML =
      '<div class="rank">#' + (i + 1) + '</div>' +
      '<img class="thumb" alt="Match ' + (i + 1) + '" src="' + item.thumb + '">' +
      '<div class="meta">' +
        '<div class="cell">Cell <strong>' + item.cell + '</strong></div>' +
        '<div class="sub">Hamming ' + item.distance + '/64 · ' + item.source + '</div>' +
        '<div class="bar"><i class="' + level + '" style="width:' +
          Math.max(2, Math.min(100, item.percent)).toFixed(1) + '%"></i></div>' +
      '</div>' +
      '<div class="pct ' + level + '">' + pct + '%</div>';
    resultsEl.appendChild(li);
  });
}

/* ============================================================================
   EVENT WIRING
   ============================================================================ */
btnScan.addEventListener('click', () => {
  if (busy) return;
  try {
    const canvas = grabVideoFrame();
    scanHash = computePHashFromCanvas(canvas);
    scanThumbUrl = makeThumb(canvas, 112, 152);
    updateScanPreview();
    toast('Cover captured — pHash computed.', 'ok');
  } catch (err) {
    toast(err.message || 'Could not capture the frame.', 'err');
  }
});

btnRestart.addEventListener('click', () => { startCamera(); });

fileImage.addEventListener('change', async () => {
  const f = fileImage.files && fileImage.files[0];
  if (!f) return;
  try {
    const canvas = await fileToCanvas(f);
    scanHash = computePHashFromCanvas(canvas);
    scanThumbUrl = makeThumb(canvas, 112, 152);
    updateScanPreview();
    toast('Image loaded — pHash computed.', 'ok');
  } catch (err) {
    toast('Could not read image: ' + (err.message || err), 'err');
  }
});

btnMatch.addEventListener('click', async () => {
  if (busy) return;

  if (!scanHash) { toast('Scan a book cover (or upload an image) first.', 'err'); return; }

  const file = fileXlsx.files && fileXlsx.files[0];
  if (!file) { toast('Choose an .xlsx spreadsheet first.', 'err'); return; }

  let range;
  try { range = parseRange(rangeInput.value); }
  catch (err) { toast(err.message, 'err'); return; }

  try {
    setBusy(true, 'Loading libraries…');
    await ensureExcelJS();
    await ensureJSZip();       // required for comment-fill extraction
    await ensureOpenCV();      // best-effort (pure-JS fallback if missing)

    setBusy(true, 'Reading spreadsheet…');
    const arrayBuffer = await readFileAsArrayBuffer(file);

    // Hand a defensive copy to ExcelJS so both readers get a clean view.
    const workbook = new ExcelJS.Workbook();
    await workbook.xlsx.load(arrayBuffer.slice(0));

    const sheet = workbook.worksheets[0];
    if (!sheet) throw new Error('The workbook contains no worksheets.');

    setBusy(true, 'Extracting images…');
    excelImages = await extractAllImages(arrayBuffer, workbook, sheet, range);

    if (!excelImages.length) {
      renderResults([]);
      toast('No images found inside ' + rangeInput.value.toUpperCase() +
            ' (checked floating images and comment fills).', 'err');
      return;
    }

    setBusy(true, 'Ranking…');
    const ranked = excelImages
      .map((item) => {
        const dist = hammingDistance(scanHash, item.hash);
        return Object.assign({}, item, {
          distance: dist,
          percent: (1 - dist / 64) * 100
        });
      })
      .sort((a, b) => (a.distance - b.distance) || a.cell.localeCompare(b.cell))
      .slice(0, 5);

    renderResults(ranked);
    toast('Compared against ' + excelImages.length + ' image(s).', 'ok');

  } catch (err) {
    console.error(err);
    toast('Error: ' + (err && err.message ? err.message : err), 'err');
  } finally {
    setBusy(false);
  }
});

/* ============================================================================
   BOOT
   ============================================================================ */
(function init() {
  startCamera();
  ensureExcelJS().catch((e) => console.warn(e));
  ensureJSZip().catch((e) => console.warn(e));
  ensureOpenCV().catch(() => {});
})();

document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopCamera();
});
window.addEventListener('pagehide', stopCamera);

})();
</script>
